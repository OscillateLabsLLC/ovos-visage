<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Static on purpose: ocp.css spins it where it should turn, so it can stop with the music. -->
  <defs>
    <radialGradient id="label" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset="1" stop-color="#1e9bff"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g>
    <circle cx="32" cy="32" r="29" fill="#111820"/>
    <g fill="none" stroke="#2a3542" stroke-width="0.8">
      <circle cx="32" cy="32" r="25"/>
      <circle cx="32" cy="32" r="21.5"/>
      <circle cx="32" cy="32" r="18"/>
      <circle cx="32" cy="32" r="14.5"/>
    </g>
    <circle cx="32" cy="32" r="29" fill="url(#sheen)"/>
    <circle cx="32" cy="32" r="10" fill="url(#label)"/>
    <circle cx="36" cy="28.5" r="1.6" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="32" cy="32" r="1.8" fill="#05070a"/>
  </g>
</svg>
