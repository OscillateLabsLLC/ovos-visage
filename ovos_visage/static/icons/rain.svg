<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .drop { animation: fall 1.1s linear infinite; }
    .drop:nth-of-type(2) { animation-delay: -0.4s; }
    .drop:nth-of-type(3) { animation-delay: -0.75s; }
    @keyframes fall { from { transform: translate(1px, -4px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-2px, 6px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .drop { animation: none; } }
  </style>
  <g stroke="#1e9bff" stroke-width="3.5" stroke-linecap="round">
    <path class="drop" d="M22 50l-3 8"/>
    <path class="drop" d="M33 50l-3 8"/>
    <path class="drop" d="M44 50l-3 8"/>
  </g>
  <path d="M18 44h30a10 10 0 0 0 0-20 14 14 0 0 0-26.5-3A10.5 10.5 0 0 0 18 44z" fill="#d9e2ec"/>
</svg>
