<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .back { animation: drift 9s ease-in-out infinite alternate-reverse; }
    .front { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) { .back, .front { animation: none; } }
  </style>
  <path class="back" d="M30 34h20a8 8 0 0 0 0-16 11 11 0 0 0-21-2A8 8 0 0 0 30 34z" fill="#8a96a8"/>
  <path class="front" d="M14 52h30a11 11 0 0 0 0-22 15 15 0 0 0-28.5-3A11.5 11.5 0 0 0 14 52z" fill="#d9e2ec"/>
</svg>
