<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .rays { transform-box: fill-box; transform-origin: center; animation: spin 20s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rays { animation: none; } }
  </style>
  <defs>
    <radialGradient id="core" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffc93c"/>
    </radialGradient>
    <path id="long" d="M32 3v9"/>
    <path id="short" d="M32 7v5"/>
  </defs>
  <g class="rays" stroke="#ffc93c" stroke-linecap="round">
    <g stroke-width="4">
      <use href="#long"/>
      <use href="#long" transform="rotate(45 32 32)"/>
      <use href="#long" transform="rotate(90 32 32)"/>
      <use href="#long" transform="rotate(135 32 32)"/>
      <use href="#long" transform="rotate(180 32 32)"/>
      <use href="#long" transform="rotate(225 32 32)"/>
      <use href="#long" transform="rotate(270 32 32)"/>
      <use href="#long" transform="rotate(315 32 32)"/>
    </g>
    <g stroke-width="3">
      <use href="#short" transform="rotate(22.5 32 32)"/>
      <use href="#short" transform="rotate(67.5 32 32)"/>
      <use href="#short" transform="rotate(112.5 32 32)"/>
      <use href="#short" transform="rotate(157.5 32 32)"/>
      <use href="#short" transform="rotate(202.5 32 32)"/>
      <use href="#short" transform="rotate(247.5 32 32)"/>
      <use href="#short" transform="rotate(292.5 32 32)"/>
      <use href="#short" transform="rotate(337.5 32 32)"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="13" fill="url(#core)"/>
</svg>
