<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face vs reference</title>
  <link rel="stylesheet" href="/static/visage.css">
  <link rel="stylesheet" href="/static/face/face.css">
  <style>
    body { overflow: auto; }
    #sheet { display: flex; gap: 24px; padding: 16px; transform-origin: top left; }
    .panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .frame { position: relative; width: 480px; height: 800px; background: #000; overflow: hidden; }
    .reference { background-size: 640px 800px; background-position: -80px 0; background-repeat: no-repeat; }
    .label { color: var(--muted); font-size: 22px; }
  </style>
</head>
<body>
  <main id="sheet"></main>
  <script type="module" src="/static/face/compare.js"></script>
</body>
</html>
